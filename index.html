}

:root[data-theme=dark]{--bg:#000000;--card:#0B0C10;--ink:#EEF1FA;--ink2:#B9C1D8;--mut:#8A94B0;--line:#1E202B;--soft:#15171F;--elev:#12141B;--topbg:rgba(0,0,0,.85);--blue:#8AA0FF;--blue-soft:rgba(138,160,255,.14);--good:#4FD6A0;--good-soft:rgba(79,214,160,.14);--warn:#FF9F66;--warn-soft:rgba(255,159,102,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.75);color-scheme:dark}

#accBtn .dotc{width:19px;height:19px;border-radius:99px;background:conic-gradient(#FF7A59,#FFC233,#B8E651,#19C3A5,#4C92FF,#7B5CFF,#FF6FA8,#FF7A59);-webkit-mask:radial-gradient(circle,transparent 0 3.5px,#000 4px);mask:radial-gradient(circle,transparent 0 3.5px,#000 4px);grid-area:1/1;transition:transform .5s cubic-bezier(.2,.7,.2,1)}

:root[data-acc]{--hero:var(--acc);--blue:var(--acc);--blue-soft:color-mix(in srgb,var(--acc) 12%,transparent)}
:root[data-acc][data-theme=dark]{--blue:color-mix(in srgb,var(--acc) 55%,#fff);--blue-soft:color-mix(in srgb,var(--acc) 22%,transparent)}
.pop{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,calc((100vw - 1120px)/2 + 40px));width:min(410px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--elev);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45),var(--shadow);padding:18px 18px 14px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top right;transition:opacity .22s ease,transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s .28s}

function ratio(it,mode,fill){

    low.forEach(x=>{ if(ci<ex.length&&ex[ci].r>x.r){ st[x.i]={s:'drop',by:ex[ci].i}; st[ex[ci].i]={s:'use',for:x.i}; x.r=ex[ci].r; ci++; } });

      rps.forEach(x=>{ if(bi<low.length&&x.r>low[bi].r){ st[low[bi].i]={s:'drop',by:x.i}; st[x.i]={s:'use',for:low[bi].i}; low[bi].r=x.r; bi++; } });
    }
    const real=cat.items.filter(it=>!it.opt).length;
    let keep=Infinity;
    if(rule==='best') keep=cat.n||real;

    }));

    if(P>0){ pct=100*(E+ecAmt(c,'pts',mode))/P+ecAmt(c,'pct',mode); }
    return {pct:pct,progress:allP?done/allP:0};
  }
  let num=0,den=0,tw=0,pw=0;
  c.cats.forEach(k=>{
    const w=k.w||0; tw+=w;
    const real=k.items.filter(it=>!it.opt);
    const entered=real.filter(it=>it.e!=null&&it.p>0).length;
    const denom=Math.max(1,Math.min(real.length,k.rule==='best'?(k.n||real.length):((k.drop>0&&(k.rule==='avg'||k.rule==='sum'))?real.length-k.drop:real.length)));
    pw+=w*Math.min(1,entered/denom);
    const r=catRes(k,mode,fill);
    if(r){ num+=w*r.pct; den+=w; }
  });
  let pct=null;
  if(den>0){
    pct=num/den;
    pct+=ecAmt(c,'pct',mode);
    const T=ecTotal(c); if(T>0) pct+=100*ecAmt(c,'pts',mode)/T;
  }
  return {pct:pct,progress:tw?pw/tw:0};
}

function needed(c,min){
  const g=x=>{const p=courseRes(c,'proj',x).pct; return p==null?-1e9:p+(c.lenience||0)+1e-9;};

  if(g(150)<min) return {kind:'out'};
  let lo=0,hi=150;
  for(let i=0;i<50;i++){ const mid=(lo+hi)/2; if(g(mid)>=min) hi=mid; else lo=mid; }

}

function ruleText(k){

  if(r==='avg') return (k.items.length>1?'Each item counts equally.':'')+dn+rp;
  if(r==='sum') return (dn+rp).trim();

  if(r==='cap') return Math.round((k.cap||0)*100)+'% of all points is full credit. Enter points earned and possible so far.';

function pastPct(n){
  if(OLD_PCT[n]!=null) return OLD_PCT[n];
  const h=HIST[n]; return (h&&h.variants&&h.variants.length===1&&h.variants[0].pct!=null)?h.variants[0].pct:null;
}
function pastDetail(n){
  const h=HIST[n]; if(!h||!h.variants||!h.variants.length) return '';
  const many=h.variants.length>1;
  return (many?'<div class="semnote" style="margin:4px 0 0">Your sheet has '+h.variants.length+' versions of this class, shown below.</div>':'')
  +h.variants.map(function(v,vi){
    const cats=v.cats.map(function(k){
      const its=k.items.map(i=>'<span class="chip">'+(i.n?esc(i.n)+' ':'')+'<b>'+fx(i.e)+'</b>/'+fx(i.p)+'</span>').join('');
      const ex=(k.extra||[]).map(x=>'<span class="chip ex'+(x.e<0?' neg':'')+'">'+(x.n?esc(x.n)+' ':'')+(x.e<0?'−'+fx(-x.e)+' deducted':'+'+fx(x.e)+' extra')+'</span>').join('');
      return '<div class="hxc"><div class="hxh"><b>'+esc(k.name)+'</b><span>'+trim((Math.round(k.w*1000)/10).toFixed(1))+'% of grade</span><span class="hxa">'+(k.avg!=null?f3(k.avg*100)+'%':'–')+'</span></div>'
        +'<div class="hxi">'+its+ex+'</div>'+(k.note?'<div class="hxn">'+esc(k.note)+'</div>':'')+'</div>';
    }).join('');
    return (many?'<div class="hxv">Version '+(vi+1)+'</div>':'')+cats
      +'<div class="hxf">Final '+(v.pct!=null?f3(v.pct)+'%':'–')+(v.letter?' · '+esc(v.letter):'')+'</div>';
  }).join('');
}
function pastRow(x,gg,cr){

function moveSec(id,d){

  if(d<0) b.before(a); else b.after(a);

  if(!REDUCED){ const o={duration:380,easing:'cubic-bezier(.2,.7,.2,1)'};

const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function setTxt(el,t){
  if(!el||el.textContent===t) return;
  el.textContent=t;
  if(!REDUCED){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function tweenPct(el,to){
  if(!el) return;
  const from=el._v; el._v=to;
  cancelAnimationFrame(el._raf);
  clearTimeout(el._to);
  if(REDUCED||to==null||from==null||from===to){ el.textContent=pctS(to); return; }
  const t0=performance.now(), D=420;
  clearTimeout(el._to); el._to=setTimeout(function(){ cancelAnimationFrame(el._raf); el.textContent=pctS(to); },D+80);
  (function step(now){
    const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3);
    el.textContent=k<1?f3(from+(to-from)*e)+'%':pctS(to);
    if(k<1) el._raf=requestAnimationFrame(step);
  })(t0);
}
function mount(id,html){ const h=$(id); if(h&&!h.firstChild) h.innerHTML=html; return h; }

function render(quiet){
  const m=$('#main');
  if(view==='home'||!getC(view)){ view='home'; m.innerHTML=homeView(); }
  else m.innerHTML=courseView(getC(view));
  if(!REDUCED&&!quiet){ m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); clearTimeout(m._et); m._et=setTimeout(function(){ m.classList.remove('enter'); },900); }
  refresh();
}
function refresh(){
  if(view==='home'){
    const h=$('#heroBox'); if(h) h.innerHTML=heroHtml();
    const g=$('#gpasum'); if(g) g.innerHTML=gpaSumHtml();
    const pb=$('#projbox'); if(pb) pb.innerHTML=projHomeHtml();
    return;
  }
  const c=getC(view); if(!c) return;
  updateSum(c);
  updateProj(c);
  $('#need').innerHTML=needHtml(c);
  $$('.cpct').forEach(el=>{
    const k=c.cats[+el.dataset.k]; const r=catRes(k,'whatif',null);
    el.textContent=r?pctS(r.pct):'–';
  });
  $$('[data-rl]').forEach(el=>{ el.innerHTML=c.pooled?'':ruleLive(c,c.cats[+el.dataset.rl]); });
  const infos=c.cats.map(k=>c.pooled?null:dropInfo(k));
  $$('.grid[data-r]').forEach(row=>{
    const p=row.dataset.r.split('-'), k=c.cats[+p[0]], d=infos[+p[0]], s=d&&d.st[+p[1]], tg=row.querySelector('[data-tag]');
    row.classList.toggle('dropped',!!(s&&s.s==='drop'));
    if(!tg) return;
    let t='',cl='tag';
    if(s&&s.s==='drop'){ t=s.by!=null?'Replaced by '+k.items[s.by].n:'Dropped'; cl+=' d'; }
    else if(s&&s.s==='use'){ t='Replaces '+k.items[s.for].n; cl+=' u'; }
    else if(s&&s.s==='count'&&(d.dropped.length||d.pairs.length)){ t='Counts'; cl+=' c'; }
    tg.className=cl; tg.textContent=t;
  });
  $$('.rpct').forEach(el=>{
    const it=c.cats[+el.dataset.k].items[+el.dataset.i];
    el.classList.remove('wi','on');
    if(it.w!=null&&it.p>0){ el.textContent=pctS(100*it.w/it.p); el.classList.add('wi'); el.title=it.e!=null&&it.p>0?'What-if (earned: '+pctS(100*it.e/it.p)+')':'What-if'; }
    else if(it.e!=null&&it.p>0){ el.textContent=pctS(100*it.e/it.p); el.classList.add('on'); el.title=''; }
    else { el.textContent='–'; el.title=''; }
  });
}

function mergeSimple(v){
  const w=fromSimple(v); let jump=null, added=0;
  if(Array.isArray(v.semesters)&&v.semesters.length) w.sems.forEach(sm=>{
    const ex=W.sems.find(x=>x.name.trim().toLowerCase()===sm.name.trim().toLowerCase());
    if(ex){ sm.courses.forEach(c=>{ if(!ex.courses.some(y=>y.name.trim().toLowerCase()===c.name.trim().toLowerCase())){ ex.courses.push(c); added++; } }); if(w.active===sm.id) jump=ex.id; }
    else { W.sems.push(sm); added+=sm.courses.length; if(w.active===sm.id) jump=sm.id; }
  });

const AI_PROMPT=`I'm going to give you my syllabi and/or my grades (PDFs, screenshots, spreadsheets, Canvas exports, or pasted text). Turn everything into ONE JSON file for my grade tracker web app, and give it back as a downloadable file named grades.json (or, if you can't make files, as a single code block I can save as grades.json).

What to do:
- For each syllabus: create the class, and read its grading policy carefully. Pull out every grade category and its weight, how scores are combined (average, total points, best N, dropped lowest scores, a final that replaces the lowest exam, optional extra work that replaces a low score, capped points), the grading scale cutoffs, the credits, any extra credit, and any rules worth remembering (late policy, attendance, no make-ups). Put those rules in the class "notes" as short plain sentences.
- Create every graded item you can find in the syllabus or schedule (each exam, quiz, homework, project, reflection) as an item with its due date, "earned": null, and its point value ("outOf"). If the syllabus doesn't give points, use 100.
- If I also give you grades, fill in "earned" for the items they match. Don't guess scores: if a score isn't graded or isn't given, use null.
- If something is unclear or the syllabus contradicts itself (weights that don't add to 100, a missing scale), ask me before you write the file.

Use exactly this format:

{
  "semesters": [
    {
      "name": "Fall 2026",
      "current": true,
      "finished": false,
      "classes": [
        {
          "name": "Intro to Biology",
          "code": "BIOSC 0150",
          "credits": 3,
          "scale": "plus-minus",
          "categories": [
            {
              "name": "Homework",
              "weight": 20,
              "scoring": "average",
              "dropLowest": 1,
              "items": [
                { "name": "HW 1", "earned": 9, "outOf": 10 },
                { "name": "HW 2", "earned": null, "outOf": 10, "due": "2026-09-30" }
              ]
            },
            {
              "name": "Exams",
              "weight": 80,
              "scoring": "average",
              "replaceLowestWithFlagged": true,
              "items": [
                { "name": "Midterm", "earned": 80, "outOf": 100 },
                { "name": "Final", "earned": null, "outOf": 100, "replacesLowest": true }
              ]
            }
          ]
        }
      ]
    }
  ],
  "earlier": [
    { "name": "Spring 2026", "classes": [ { "name": "Calculus I", "credits": 4, "grade": "A-" } ] }
  ]
}

Rules:
- "weight" is the category's share of the final grade in percent (they should add up to 100).
- "scoring" is one of: "average" (each item counts equally), "total" (add up all points), "best" (also add "bestN", how many scores count), "capped" (also add "fullCreditPercent", e.g. 80 means 80% of all points is full credit), or "optionalReplaceLowest" (items marked "optional": true replace the lowest regular score if higher).
- "dropLowest" is how many of the lowest scores get dropped (average or total only).
- "scale" is "plus-minus" (A+, A, A-, B+ ...) or "plain" (A, B, C). If the syllabus lists its own cutoffs, add "cutoffs": [ {"letter":"A","min":93,"gpa":4}, ... ].
- If a class is graded by total points instead of weighted categories, set "totalPointsGrading": true and use one category.
- Semesters where I only know the final letter grades go under "earlier". Semesters where I have the full breakdown go under "semesters". Mark this semester "current": true.
- "due" is a date like "2026-09-30". "notes" is an array of short strings.
- Optional extra credit per class: "extraCredit": { "points": 2, "percent": null, "totalPoints": 400 }.`;

  if(a==='go'){ view=b.dataset.v; wipeArmed=false; editing=false; setHash(); render(); window.scrollTo(0,0); return; }
  if(a==='jump'){ view='home'; wipeArmed=false; setHash(); render(); const el=document.getElementById(b.dataset.t); if(el&&el.classList.contains('col')){ delete LAY.col[el.dataset.sec]; saveLay(); el.classList.remove('col'); } if(el) el.scrollIntoView(); else window.scrollTo(0,0); return; }
  if(a==='sectoggle'){ const id=b.dataset.s; LAY.col[id]=!LAY.col[id]; saveLay(); b.closest('.hsec').classList.toggle('col',!!LAY.col[id]); b.setAttribute('aria-expanded',String(!LAY.col[id])); return; }
  if(a==='secmove'){ moveSec(b.dataset.s,+b.dataset.d); return; }
  const c=b.dataset.c?getC(b.dataset.c):null;
  if(a==='add'){ c.cats[+b.dataset.k].items.push(I('New item',(c.pooled?5:100))); save(); render(); }
  else if(a==='addopt'){ c.cats[+b.dataset.k].items.push(I('Case study',100,null,'',true)); save(); render(); }
  else if(a==='goal'){ c.target=b.dataset.l; save(); refresh(); }
  else if(a==='newclass'){ newClassModal(); }
  else if(a==='edit'){ editing=!editing; render(true); }
  else if(a==='addcat'){ c.cats.push({name:'New category',w:c.pooled?0:Math.max(0,100-c.cats.reduce((t,k)=>t+(k.w||0),0)),rule:'avg',items:[I('Item 1',c.pooled?10:100)]}); save(); render(true); }
  else if(a==='delcat'){
    const k=c.cats[+b.dataset.k];
    if(c.cats.length<2){ alert('A class needs at least one category.'); return; }
    if(!k.items.some(i=>i.e!=null||i.w!=null)||confirm('Delete “'+k.name+'” and its scores?')){ c.cats.splice(+b.dataset.k,1); save(); render(true); }
  }
  else if(a==='delclass'){
    if(confirm('Delete '+c.name+' and all its scores? This can’t be undone.')){ S.courses=S.courses.filter(x=>x.id!==c.id); delete S.gpaPick[c.id]; editing=false; view='home'; save(); setHash(); render(); window.scrollTo(0,0); }
  }
  else if(a==='rp'||a==='optflag'){ const it=c.cats[+b.dataset.k].items[+b.dataset.i]; if(a==='rp') it.rp=!it.rp; else it.opt=!it.opt; save(); render(true); }
  else if(a==='copyprompt'){
    const ta=document.getElementById('aiPrompt'); const done=()=>{ b.textContent='Copied'; setTimeout(function(){ b.textContent='Copy prompt'; },1600); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(AI_PROMPT).then(done,function(){ ta.select(); document.execCommand('copy'); done(); });
    else { ta.select(); document.execCommand('copy'); done(); }
  }
  else if(a==='del'){ c.cats[+b.dataset.k].items.splice(+b.dataset.i,1); save(); render(); }
  else if(a==='download'){ const blob=new Blob([JSON.stringify(W,null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='grade-tracker-backup.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1000); }
  else if(a==='export'){ $('#bk').value=JSON.stringify(W); $('#bkmsg').textContent='Copy all of that text and keep it somewhere safe.'; }
  else if(a==='import'){
    try{ const v=JSON.parse($('#bk').value); if(!okFile(v)) throw new Error('x'); importFile(v); }
    catch(e){ $('#bkmsg').textContent='That text isn’t a valid backup. Paste the full text you copied earlier.'; }
  }
  else if(a==='wipe'){
    if(!wipeArmed){ wipeArmed=true; b.textContent='Click again to erase every score in this semester'; }
    else { wipeArmed=false; S.courses.forEach(x=>{ x.cats.forEach(k=>k.items.forEach(it=>{it.e=null;it.w=null;})); if(x.ec){ x.ec.pts.e=x.ec.pts.w=x.ec.pct.e=x.ec.pct.w=null; } }); save(); render(); }
  }
});

document.addEventListener('change',function(ev){
  const t=ev.target; if(!(t&&(t.id==='bkfile'||t.id==='bkfile2')&&t.files&&t.files[0])) return;
  const r=new FileReader();
  r.onload=function(){ try{ const v=JSON.parse(r.result); if(!okFile(v)) throw new Error('x'); importFile(v); }catch(e){ const m=$('#bkmsg'); if(m) m.textContent='That file isn’t a valid grade file.'; alert('That file isn’t a valid grade file.'); } };
  r.readAsText(t.files[0]);
});

/* ---------- start ---------- */
(function init(){
  let src3=readLocal(KEY3), migrated=false;
  if(src3&&Array.isArray(src3.sems)) W=loadAny(src3);
  else{
    let emb=null; try{ emb=JSON.parse(document.getElementById('saved').textContent); }catch(e){}
    const loc=readLocal(KEY), et=(emb&&emb.ts)||0, lt=(loc&&loc.ts)||0;
    let src=(lt>et)?loc:emb;
    if(!src){ const o=readLocal(KEY1); if(o&&o.courses) src=o; }
    W=loadAny(src||null); migrated=!!src;
  }
  S=W.sems.find(x=>x.id===W.active)||W.sems[0]; W.active=S.id;
  refreshPrior(); syncColors();
  if(migrated) save();
  const h=(location.hash||'').replace('#','');
  if(h&&getC(h)) view=h;
  render();
  try{
    const sc=JSON.parse(sessionStorage.getItem('gt-scroll')||'null');
    if(sc&&Date.now()-sc.t<20000) window.scrollTo(0,sc.y);
    sessionStorage.removeItem('gt-scroll');
  }catch(e){}
  
})();
