  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A0D18;--card:#131828;--ink:#EEF1FA;--ink2:#B9C1D8;--mut:#8A94B0;--line:#232A41;--soft:#1B2136;--elev:#1E2540;--topbg:rgba(10,13,24,.88);--blue:#8AA0FF;--blue-soft:rgba(138,160,255,.14);--good:#4FD6A0;--good-soft:rgba(79,214,160,.14);--warn:#FF9F66;--warn-soft:rgba(255,159,102,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.75);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0A0D18;--card:#131828;--ink:#EEF1FA;--ink2:#B9C1D8;--mut:#8A94B0;--line:#232A41;--soft:#1B2136;--elev:#1E2540;--topbg:rgba(10,13,24,.88);--blue:#8AA0FF;--blue-soft:rgba(138,160,255,.14);--good:#4FD6A0;--good-soft:rgba(79,214,160,.14);--warn:#FF9F66;--warn-soft:rgba(255,159,102,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.75);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--topbg);z-index:30}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.disp{font-family:var(--disp);font-weight:800;letter-spacing:-0.04em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.hero{position:relative;overflow:hidden;margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px 40px;align-items:center;padding:clamp(24px,3.6vw,44px);border-radius:36px;background-color:var(--hero);background-image:radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.4px);background-size:24px 24px;color:#fff}

.panel{padding:6px 26px}

.gpagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}

.rpct{transition:background-color .25s ease,color .25s ease,border-color .25s ease}
input[data-f="w"]:not(:placeholder-shown){background:var(--blue-soft);border-color:var(--blue)}
input[type=number],input[type=text],select{transition:border-color .18s ease,background-color .18s ease}
.btn,.tabs button,.back,.fld{transition:border-color .18s ease,color .18s ease,background-color .18s ease,opacity .18s ease}
.track i,.tbar i{transition:width .55s cubic-bezier(.2,.7,.2,1)}
.gletter,.gpct,.projres .l,.projres .p{display:block}
.projres .l,.projres .p{display:inline-block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bump{0%{opacity:.35;transform:translateY(5px)}100%{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bump{animation:bump .32s cubic-bezier(.2,.7,.2,1)}
#main.enter>*,#main.enter .cpage>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) backwards}
#main.enter>*:nth-child(2),#main.enter .cpage>*:nth-child(2){animation-delay:.04s}
#main.enter>*:nth-child(3),#main.enter .cpage>*:nth-child(3){animation-delay:.08s}
#main.enter>*:nth-child(4),#main.enter .cpage>*:nth-child(4){animation-delay:.12s}
#main.enter>*:nth-child(n+5),#main.enter .cpage>*:nth-child(n+5){animation-delay:.16s}
details.hx[open]>.hxb{animation:rise .3s cubic-bezier(.2,.7,.2,1)}
details.hx>summary .n::after{display:inline-block;transition:transform .2s ease}
.savestat.ok,.savestat.busy,.savestat.warn{animation:fadeIn .2s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.projh{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-0.045em;margin:0}
.projp{color:var(--mut);font-size:13.5px;margin:6px 0 0;max-width:62ch}

.back{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px 0;font-weight:600}
.back:hover{color:var(--ink)}
.cpage{--c:var(--blue);--fg:#fff}

.ecbox{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 28px;align-items:center;color:var(--ink2);background:var(--elev);border:1px solid var(--line);border-radius:22px;padding:18px 22px;box-shadow:var(--shadow)}

.cat{margin-top:18px;overflow:hidden}

.rpct.on{background:var(--c);color:var(--fg)}

function ecShape(e){
  const bx=x=>({e:(x&&typeof x.e==='number')?x.e:null,w:(x&&typeof x.w==='number')?x.w:null});
  const o={label:e.label||'Extra credit',pts:bx(e.pts),pct:bx(e.pct),total:(typeof e.total==='number'&&e.total>0)?e.total:null};

}

    if(typeof sc.fill==='number') c.fill=sc.fill;
    if(sc.target) c.target=sc.target;
    if(c.ec&&sc.ec){
      const m=ecShape(sc.ec);
      c.ec.pts=m.pts; c.ec.pct=m.pct; c.ec.total=m.total;
    }
    c.cats.forEach(k=>{

}

/* ---------- grade engine ---------- */
function ratio(it,mode,fill){
  if(!(it.p>0)) return null;
  if((mode==='proj'||mode==='whatif')&&it.w!=null) return it.w/it.p;
  if(it.e!=null) return it.e/it.p;
  if(mode==='proj'&&!it.opt&&fill!=null) return fill/100;
  return null;
}
function catRes(cat,mode,fill){
  const its=cat.items;
  if(cat.rule==='swap'){
    const q=[],cs=[];
    its.forEach(it=>{
      if(it.opt){
        let r=null;
        if(it.p>0){ if((mode==='proj'||mode==='whatif')&&it.w!=null) r=it.w/it.p; else if(it.e!=null) r=it.e/it.p; }
        if(r!=null) cs.push(r);
      }else{
        const r=ratio(it,mode,fill); if(r!=null) q.push(r);
      }
    });
    if(!q.length) return null;
    cs.sort((a,b)=>b-a);
    const idx=q.map((r,i)=>i).filter(i=>q[i]>0).sort((a,b)=>q[a]-q[b]);
    let ci=0;
    idx.forEach(i=>{ if(ci<cs.length&&cs[ci]>q[i]){ q[i]=cs[ci]; ci++; } });
    return {pct:100*q.reduce((a,b)=>a+b,0)/q.length};
  }
  const list=[];
  its.forEach(it=>{ const r=ratio(it,mode,fill); if(r!=null) list.push({r:r,p:it.p,e:r*it.p}); });
  if(!list.length) return null;
  const sumE=a=>a.reduce((s,x)=>s+x.e,0), sumP=a=>a.reduce((s,x)=>s+x.p,0);
  if(cat.rule==='avg') return {pct:100*list.reduce((s,x)=>s+x.r,0)/list.length};
  if(cat.rule==='best'){
    const top=list.slice().sort((a,b)=>b.r-a.r).slice(0,cat.n||list.length);
    return {pct:100*sumE(top)/sumP(top)};
  }
  if(cat.rule==='cap') return {pct:Math.min(100,100*(sumE(list)/sumP(list))/cat.cap)};
  return {pct:100*sumE(list)/sumP(list)};
}

  const b=c.ec&&c.ec[k]; if(!b) return 0;
  const v=(mode!=='cur'&&b.w!=null)?b.w:b.e; if(v==null) return 0;
  return (c.ec.max!=null&&c.ec.mu===k)?Math.min(v,c.ec.max):v;
}

  if(c.ec&&c.ec.total>0) return c.ec.total;
  let t=0; c.cats.forEach(k=>k.items.forEach(it=>{ if(!it.opt&&it.p>0) t+=it.p; })); return t;
}

  if(c.pooled){

    c.cats.forEach(k=>k.items.forEach(it=>{

      if(it.e!=null){ done+=it.p; }
      const r=ratio(it,mode,fill);
      if(r!=null){ E+=r*it.p; P+=it.p; }
    }));
    let pct=null;
    if(P>0){ pct=100*(E+ecAmt(c,'pts',mode))/P+ecAmt(c,'pct',mode); }
    return {pct:pct,progress:allP?done/allP:0};
  }
  let num=0,den=0,tw=0,pw=0;
  c.cats.forEach(k=>{
    const w=k.w||0; tw+=w;
    const real=k.items.filter(it=>!it.opt);
    const entered=real.filter(it=>it.e!=null&&it.p>0).length;
    const denom=Math.min(real.length,k.rule==='best'?(k.n||real.length):real.length)||1;
    pw+=w*Math.min(1,entered/denom);
    const r=catRes(k,mode,fill);
    if(r){ num+=w*r.pct; den+=w; }
  });
  let pct=null;
  if(den>0){
    pct=num/den;
    pct+=ecAmt(c,'pct',mode);
    const T=ecTotal(c); if(T>0) pct+=100*ecAmt(c,'pts',mode)/T;
  }
  return {pct:pct,progress:tw?pw/tw:0};
}
function scaleRow(c,pct){
  if(pct==null) return null;
  const sc=SCALES[c.scale]; const adj=pct+(c.lenience||0)+1e-9;
  return sc.find(r=>adj>=r[0])||sc[sc.length-1];
}

function remaining(c){

}
function needed(c,min){
  const g=x=>{const p=courseRes(c,'proj',x).pct; return p==null?-1e9:p+(c.lenience||0)+1e-9;};
  if(g(0)>=min) return {kind:'lock'};
  if(g(150)<min) return {kind:'out'};
  let lo=0,hi=150;
  for(let i=0;i<50;i++){ const mid=(lo+hi)/2; if(g(mid)>=min) hi=mid; else lo=mid; }
  const x=Math.ceil(hi*1000)/1000;
  return {kind:x>100?'over':'need',x:x};
}

function gpaCalc(kind){
  let cr=0,qp=0,missing=[];
  S.courses.forEach(c=>{
    if(!(c.credits>0)){ missing.push(c.name); return; }
    let g=null;
    if(kind==='cur') g=gpaOf(c,courseRes(c,'cur').pct);
    else if(kind==='proj') g=gpaOf(c,courseRes(c,'proj').pct);
    else if(kind==='whatif') g=gpaOf(c,courseRes(c,'whatif').pct);
    else { const pick=S.gpaPick[c.id]; g=(pick&&GPAOF[pick]!==undefined)?GPAOF[pick]:gpaOf(c,courseRes(c,pick==='proj'?'proj':'whatif').pct); }
    if(g==null) return;
    cr+=c.credits; qp+=c.credits*g;
  });
  return {cr:cr,qp:qp,sem:cr?qp/cr:null,cum:(PRIOR_CR+cr)?(PRIOR_QP+qp)/(PRIOR_CR+cr):null,missing:missing};
}

  pts.forEach(function(p,i){

    let cr=0,qp=0; PRIOR.slice(0,si+1).forEach(t=>t.c.forEach(x=>{cr+=x[1];qp+=x[1]*x[2];}));
    return '<section class="card sem"><div class="semtop" style="--hd:'+SEMCOL[si][0]+';--hf:'+SEMCOL[si][1]+'"><h3>'+esc(s.t)+'</h3><div class="g">'+g2(sqp/scr)+'<small>'+scr+' credits</small></div></div><div class="semb">'
      +s.c.map(x=>pastRow(x,(LETTER_OF_GPA[String(x[2])]||x[2]),x[1]+' cr')).join('')
      +(s.x||[]).map(n=>pastRow([n],'–','no credit')).join('')
      +'<div class="semnote">Cumulative after this semester: <b>'+g2(qp/cr)+'</b>'+((OLD_X[si]||[]).length?'<br>Not in GPA (0.00 in your sheet): '+OLD_X[si].map(esc).join(', '):'')+'</div></div></section>';
  }).join('');
  const banner=anyScore?'':'<div class="banner"><b>Start with what you already have.</b> Upload a grade file, or open a class and fill in the Earned column. <label class="btn pri" style="cursor:pointer;margin-left:8px">Upload grade file<input type="file" id="bkfile2" accept=".json,application/json" hidden></label></div>';
  return '<h1 class="page-h">Fall 2026</h1>'
    +'<div id="heroBox">'+heroHtml()+'</div>'+banner
    +'<div class="sechead" id="classes"><h2>This semester</h2></div>'
    +'<div class="tiles">'+tiles+'</div>'
    +'<div class="sechead"><h2>Coming up</h2></div><div class="card panel">'+upHtml+'</div>'
    +'<div class="sechead" id="gpa"><h2>GPA planner</h2></div>'
    +'<div id="gpasum"></div><div class="card panel scroll"><table><thead><tr><th>Class</th><th>Credits</th><th class="r">Now</th><th class="r">What-if</th><th class="r">Letter to use</th></tr></thead><tbody>'+gpaRows+'</tbody></table></div>'
    +(PRIOR.length?'<div class="sechead" id="history"><h2>Past semesters</h2></div>'
    +'<div class="semgrid">'+cards+'</div>'
    :'')
    +'<div id="projbox">'+projHomeHtml()+'</div>'
    +backupHtml();
}

function ecHtml(c){
  const e=c.ec;
  const lim=k=>(e.max!=null&&e.mu===k)?' <small>max '+e.max+'</small>':'';
  const fld=(k,f,v,lab)=>'<input type="number" step="any" inputmode="decimal" data-f="'+f+'" data-u="'+k+'" data-c="'+c.id+'" value="'+(v==null?'':v)+'" placeholder="–" aria-label="'+lab+'">';
  const tot=c.pooled?'':'<label class="ectot">out of <input type="number" step="any" inputmode="decimal" data-f="ectotal" data-c="'+c.id+'" value="'+(e.total==null?'':e.total)+'" placeholder="'+f3(ecTotal(c))+'" aria-label="Total points in this class"> total points</label>';
  const hp=c.pooled?'Added to the points you’ve earned.':'Divided by the total points, then added to your final percent.';
  return '<section class="ecbox" id="ecbox"><div class="ecl"><b>'+esc(e.label)+'</b><small>Use points, percent, or both. A what-if replaces the earned amount on that row.</small></div>'
    +'<div class="ecgrid"><div></div><div class="ech">Earned</div><div class="ech">What-if</div>'
    +'<div class="eck">Points'+lim('pts')+'<small>'+hp+'</small></div>'+fld('pts','ece',e.pts.e,'Extra credit points earned')+fld('pts','ecw',e.pts.w,'Extra credit points what-if')
    +'<div class="eck">Percent'+lim('pct')+'<small>Added straight onto your final percent.</small></div>'+fld('pct','ece',e.pct.e,'Extra credit percent earned')+fld('pct','ecw',e.pct.w,'Extra credit percent what-if')
    +'</div>'+tot+'</section>';
}
function courseView(c){
  const cats=c.cats.map((k,ki)=>{
    const meta=c.pooled
      ?'<span>'+k.items.reduce((a,x)=>a+(x.p||0),0)+' points total</span>'
      :'<label>Weight <input type="number" step="any" inputmode="decimal" data-f="cw" data-c="'+c.id+'" data-k="'+ki+'" value="'+k.w+'" aria-label="Category weight in percent"> %</label>';
    const rt=ruleText(k);
    return '<section class="card cat"><div class="cathead"><h3>'+esc(k.name)+'</h3><div class="catmeta">'+meta+'<span class="cpct" data-k="'+ki+'">–</span></div></div>'
      +(rt?'<div class="rule">'+rt+'</div>':'')
      +'<div class="grid h"><div>Item</div><div>Earned</div><div>Out of</div><div>What-if</div><div style="text-align:center">Score</div><div></div></div>'
      +k.items.map((it,ii)=>itemRow(c,ki,ii,it)).join('')
      +'<div class="addrow"><button class="btn" data-act="add" data-c="'+c.id+'" data-k="'+ki+'">Add item</button>'
      +(k.rule==='swap'?'<button class="btn" data-act="addopt" data-c="'+c.id+'" data-k="'+ki+'">Add case study</button>':'')+'</div></section>';
  }).join('');
  const ec=ecHtml(c);
  const notes='<div class="notes"><h2>From the syllabus</h2><ul>'+c.notes.map(n=>'<li>'+n+'</li>').join('')+'</ul></div>';
  const tot=c.cats.reduce((a,k)=>a+(k.w||0),0);
  const wn=(!c.pooled&&Math.abs(tot-100)>0.01)?'<div class="banner">Category weights add up to '+f1(tot)+'%, not 100%. Grades are scaled to the weights you’ve set.</div>':'';
  return '<div class="cpage" style="--c:'+COLORS[c.id]+';--fg:'+TILE[c.id]+'"><button class="back" data-act="go" data-v="home">← All classes</button>'
    +'<section class="cband"><header class="chead"><div><h1>'+esc(c.name)+'</h1><p>'+esc(c.code)+'</p></div>'
    +'<label class="fld">Credits <input type="number" step="0.5" min="0" inputmode="decimal" data-f="credits" data-c="'+c.id+'" value="'+(c.credits==null?'':c.credits)+'" placeholder="–"></label></header>'
    +'<div id="sum"></div></section>'
    +ec+wn+cats
    +'<section class="card csum" id="projcard"><h2 class="projh">Projected final</h2><div id="projsum"></div>'
    +'<div class="fillbox"><label for="fill"><span>Assume the rest of your work scores</span><b id="fillv">'+c.fill+'%</b></label>'
    +'<input type="range" id="fill" min="0" max="110" step="1" value="'+c.fill+'" data-f="fill" data-c="'+c.id+'"></div>'
    +'<div class="need" id="need"></div></section>'
    +notes+'</div>';
}
function projHtml(c){
  return '<div class="projres"><span class="l" data-s="pL"></span><span class="p" data-s="pP"></span><span class="h">projected final'+(c.scaleAssumed?' · assumed +/− scale':'')+'</span></div>';
}
function sumHtml(c){
  const as=c.scaleAssumed?' · assumed +/− scale':'';
  return '<div class="gblocks">'
    +'<div><div class="glabel">Graded so far</div><div class="gletter" data-s="cL"></div><div class="gpct" data-s="cP"></div><div class="ghint" data-s="cH"></div></div>'
    +'<div><div class="glabel">What-if final</div><div class="gletter" data-s="wL"></div><div class="gpct" data-s="wP"></div><div class="ghint">'+as.replace(/^ · /,'')+'</div></div></div>'
    +'<div class="track" title="Share of the grade that has a score"><i data-s="bar"></i></div>';
}
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function setTxt(el,t){
  if(!el||el.textContent===t) return;
  el.textContent=t;
  if(!REDUCED){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function tweenPct(el,to){
  if(!el) return;
  const from=el._v; el._v=to;
  cancelAnimationFrame(el._raf);
  clearTimeout(el._to);
  if(REDUCED||to==null||from==null||from===to){ el.textContent=pctS(to); return; }
  const t0=performance.now(), D=420;
  clearTimeout(el._to); el._to=setTimeout(function(){ cancelAnimationFrame(el._raf); el.textContent=pctS(to); },D+80);
  (function step(now){
    const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3);
    el.textContent=k<1?f3(from+(to-from)*e)+'%':pctS(to);
    if(k<1) el._raf=requestAnimationFrame(step);
  })(t0);
}
function mount(id,html){ const h=$(id); if(h&&!h.firstChild) h.innerHTML=html; return h; }
function updateSum(c){
  const h=mount('#sum',sumHtml(c)); if(!h) return;
  const cur=courseRes(c,'cur'), wi=courseRes(c,'whatif'), q=k=>h.querySelector('[data-s="'+k+'"]');
  setTxt(q('cL'),letterOf(c,cur.pct)); tweenPct(q('cP'),cur.pct);
  setTxt(q('cH'),Math.round(cur.progress*100)+'% of the grade is in');
  setTxt(q('wL'),letterOf(c,wi.pct)); tweenPct(q('wP'),wi.pct);
  q('bar').style.width=Math.round(cur.progress*100)+'%';
}
function updateProj(c){
  const h=mount('#projsum',projHtml(c)); if(!h) return;
  const pr=courseRes(c,'proj'), q=k=>h.querySelector('[data-s="'+k+'"]');
  setTxt(q('pL'),letterOf(c,pr.pct)); tweenPct(q('pP'),pr.pct);
}

/* ---------- render + refresh ---------- */
function render(){
  const m=$('#main');
  if(view==='home'||!getC(view)){ view='home'; m.innerHTML=homeView(); }
  else m.innerHTML=courseView(getC(view));
  if(!REDUCED){ m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); clearTimeout(m._et); m._et=setTimeout(function(){ m.classList.remove('enter'); },900); }
  refresh();
}
function refresh(){
  if(view==='home'){
    const h=$('#heroBox'); if(h) h.innerHTML=heroHtml();
    const g=$('#gpasum'); if(g) g.innerHTML=gpaSumHtml();
    const pb=$('#projbox'); if(pb) pb.innerHTML=projHomeHtml();
    return;
  }
  const c=getC(view); if(!c) return;
  updateSum(c);
  updateProj(c);
  $('#need').innerHTML=needHtml(c);
  $$('.cpct').forEach(el=>{
    const k=c.cats[+el.dataset.k]; const r=catRes(k,'whatif',null);
    el.textContent=r?pctS(r.pct):'–';
  });
  $$('.rpct').forEach(el=>{
    const it=c.cats[+el.dataset.k].items[+el.dataset.i];
    el.classList.remove('wi','on');
    if(it.w!=null&&it.p>0){ el.textContent=pctS(100*it.w/it.p); el.classList.add('wi'); el.title=it.e!=null&&it.p>0?'What-if (earned: '+pctS(100*it.e/it.p)+')':'What-if'; }
    else if(it.e!=null&&it.p>0){ el.textContent=pctS(100*it.e/it.p); el.classList.add('on'); el.title=''; }
    else { el.textContent='–'; el.title=''; }
  });
}

/* ---------- events ---------- */
document.addEventListener('wheel',function(ev){ const a=document.activeElement; if(a&&a.type==='number'&&ev.target===a) a.blur(); },{passive:true});
document.addEventListener('input',function(ev){
  const t=ev.target, f=t.dataset&&t.dataset.f; if(!f) return;
  const c=t.dataset.c?getC(t.dataset.c):null;
  if(f==='e'||f==='w'||f==='p'){ const it=c.cats[+t.dataset.k].items[+t.dataset.i]; it[f]=num(t.value); if(f==='p'&&it.p==null) it.p=0; }
  else if(f==='n'){ c.cats[+t.dataset.k].items[+t.dataset.i].n=t.value; }
  else if(f==='cw'){ c.cats[+t.dataset.k].w=num(t.value)||0; }
  else if(f==='credits'){ c.credits=num(t.value); }
  else if(f==='ece'||f==='ecw'){ c.ec[t.dataset.u][f==='ece'?'e':'w']=num(t.value); }
  else if(f==='ectotal'){ c.ec.total=num(t.value); }
  else if(f==='fill'){ c.fill=num(t.value)||0; const fv=document.getElementById('fillv'); if(fv) fv.textContent=c.fill+'%'; }
  else if(f==='pick'){ S.gpaPick[c.id]=t.value; }
  if(f==='e'){
    const row=t.closest('.grid'), du=row&&row.querySelector('[data-due]');
    const it=c.cats[+t.dataset.k].items[+t.dataset.i];
    if(du){ du.classList.toggle('late',!!(it.d&&it.d<TODAY&&it.e==null)); }
  }
  save(); refresh();
});
function setHash(){ try{ location.hash=(view==='home'?'':view); }catch(e){} }
/* ---------- theme ---------- */
(function(){
  const root=document.documentElement, btn=document.getElementById('themeBtn'), mq=matchMedia('(prefers-color-scheme:dark)');
  const cur=()=>root.dataset.theme||(mq.matches?'dark':'light');
  function sync(){ if(!root.dataset.theme) root.dataset.theme=cur(); btn.setAttribute('aria-pressed',cur()==='dark'); const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=cur()==='dark'?'#0A0D18':'#1B3FD1'; }
  sync();
  btn.addEventListener('click',function(){
    const n=cur()==='dark'?'light':'dark';
    root.classList.add('theming'); root.dataset.theme=n;
    try{localStorage.setItem('pitt-theme',n)}catch(e){}
    sync(); setTimeout(()=>root.classList.remove('theming'),500);
  });
})();
document.addEventListener('click',function(ev){
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='go'){ view=b.dataset.v; wipeArmed=false; setHash(); render(); window.scrollTo(0,0); return; }
  if(a==='jump'){ view='home'; wipeArmed=false; setHash(); render(); const el=document.getElementById(b.dataset.t); if(el) el.scrollIntoView(); else window.scrollTo(0,0); return; }
  const c=b.dataset.c?getC(b.dataset.c):null;
  if(a==='add'){ c.cats[+b.dataset.k].items.push(I('New item',(c.pooled?5:100))); save(); render(); }
  else if(a==='addopt'){ c.cats[+b.dataset.k].items.push(I('Case study',100,null,'',true)); save(); render(); }
  else if(a==='del'){ c.cats[+b.dataset.k].items.splice(+b.dataset.i,1); save(); render(); }
  else if(a==='download'){ const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='grade-tracker-backup.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1000); }
  else if(a==='export'){ $('#bk').value=JSON.stringify(S); $('#bkmsg').textContent='Copy all of that text and keep it somewhere safe.'; }
  else if(a==='import'){
    try{ const v=JSON.parse($('#bk').value); if(!v||!v.courses) throw new Error('x'); S=loadMerged(v); save(); render(); setStat('Grades loaded','ok'); }
    catch(e){ $('#bkmsg').textContent='That text isn’t a valid backup. Paste the full text you copied earlier.'; }
  }
  else if(a==='wipe'){
    if(!wipeArmed){ wipeArmed=true; b.textContent='Click again to erase every score'; }
    else { wipeArmed=false; S.courses.forEach(x=>{ x.cats.forEach(k=>k.items.forEach(it=>{it.e=null;it.w=null;})); if(x.ec){ x.ec.pts.e=x.ec.pts.w=x.ec.pct.e=x.ec.pct.w=null; } }); save(); render(); }
  }
});

document.addEventListener('change',function(ev){
  const t=ev.target; if(!(t&&(t.id==='bkfile'||t.id==='bkfile2')&&t.files&&t.files[0])) return;
  const r=new FileReader();
  r.onload=function(){ try{ const v=JSON.parse(r.result); if(!v||!v.courses) throw new Error('x'); S=loadMerged(v); save(); render(); setStat('Grades loaded','ok'); }catch(e){ const m=$('#bkmsg'); if(m) m.textContent='That file isn’t a valid grade file.'; alert('That file isn’t a valid grade file.'); } };
  r.readAsText(t.files[0]);
});

/* ---------- start ---------- */
(function init(){
  let emb=null; try{ emb=JSON.parse(document.getElementById('saved').textContent); }catch(e){}
  const loc=readLocal(KEY);
  const et=(emb&&emb.ts)||0, lt=(loc&&loc.ts)||0;
  const src=(lt>et)?loc:emb;
  S=loadMerged(src||null);
  S.ts=Math.max(et,lt);
  if(!src){
    const o=readLocal(KEY1);
    if(o&&o.courses) o.courses.forEach(oc=>{ const c=getC(oc.id); if(c&&oc.credits!=null) c.credits=oc.credits; });
  }
  const h=(location.hash||'').replace('#','');
  if(h&&getC(h)) view=h;
  render();
  try{
    const sc=JSON.parse(sessionStorage.getItem('gt-scroll')||'null');
    if(sc&&Date.now()-sc.t<20000) window.scrollTo(0,sc.y);
    sessionStorage.removeItem('gt-scroll');
  }catch(e){}
  
})();

</script></body></html>
