<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tally</title><meta name="theme-color" content="#1B3FD1"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tally"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>try{var t=localStorage.getItem('pitt-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style id="app-css">:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#0D1226; --ink2:#3A4360; --mut:#69728C; --line:#E4E8F2; --soft:#EFF1F8;
  --hero:#1B3FD1; --elev:#FFFFFF; --topbg:rgba(255,255,255,.95); --on:#fff;
  --blue:#1B3FD1; --blue-soft:#E8EDFD; --gold:#FFB81C; --good:#0F8A5F; --good-soft:#E1F5EA; --warn:#B8400A; --warn-soft:#FFF0E6;
  --disp:"Unbounded","Plus Jakarta Sans",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(13,18,38,.05),0 12px 30px -16px rgba(13,18,38,.18);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000000;--card:#0B0C10;--ink:#EEF1FA;--ink2:#B9C1D8;--mut:#8A94B0;--line:#1E202B;--soft:#15171F;--elev:#12141B;--topbg:rgba(0,0,0,.85);--blue:#8AA0FF;--blue-soft:rgba(138,160,255,.14);--good:#4FD6A0;--good-soft:rgba(79,214,160,.14);--warn:#FF9F66;--warn-soft:rgba(255,159,102,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.75);color-scheme:dark}}
:root[data-theme=dark]{--bg:#000000;--card:#0B0C10;--ink:#EEF1FA;--ink2:#B9C1D8;--mut:#8A94B0;--line:#1E202B;--soft:#15171F;--elev:#12141B;--topbg:rgba(0,0,0,.85);--blue:#8AA0FF;--blue-soft:rgba(138,160,255,.14);--good:#4FD6A0;--good-soft:rgba(79,214,160,.14);--warn:#FF9F66;--warn-soft:rgba(255,159,102,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.75);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--topbg);z-index:30}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.disp{font-family:var(--disp);font-weight:800;letter-spacing:-0.04em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-0.03em;background:none;border:0;cursor:pointer;padding:0}
.mark{width:30px;height:30px;flex:0 0 auto;display:block}
.right{display:flex;align-items:center;gap:6px;min-width:0}
.tg{position:relative;width:40px;height:40px;border-radius:99px;border:0;background:var(--soft);color:var(--ink);cursor:pointer;flex:0 0 auto;display:grid;place-items:center;transition:background-color .2s ease,transform .2s ease}
#accBtn .dotc{width:19px;height:19px;border-radius:99px;background:conic-gradient(#FF7A59,#FFC233,#B8E651,#19C3A5,#4C92FF,#7B5CFF,#FF6FA8,#FF7A59);-webkit-mask:radial-gradient(circle,transparent 0 3.5px,#000 4px);mask:radial-gradient(circle,transparent 0 3.5px,#000 4px);grid-area:1/1;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
#accBtn:hover .dotc,#accBtn[aria-expanded=true] .dotc{transform:rotate(90deg)}
:root[data-acc]{--hero:var(--acc);--blue:var(--acc);--blue-soft:color-mix(in srgb,var(--acc) 12%,transparent)}
:root[data-acc][data-theme=dark]{--blue:color-mix(in srgb,var(--acc) 55%,#fff);--blue-soft:color-mix(in srgb,var(--acc) 22%,transparent)}
.pop{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 70px);right:max(16px,calc((100vw - 1120px)/2 + 40px));width:min(410px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;background:var(--elev);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45),var(--shadow);padding:18px 18px 14px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top right;transition:opacity .22s ease,transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s .28s}
.pop.open{opacity:1;visibility:visible;transform:none;transition:opacity .22s ease,transform .28s cubic-bezier(.2,.7,.2,1),visibility 0s}
.pop h4{margin:0 0 10px;font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.pop h4:not(:first-child){margin-top:18px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{position:relative;width:28px;height:28px;border-radius:99px;border:0;background:var(--c);cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(128,128,128,.25);transition:transform .15s ease}
.sw button:hover{transform:scale(1.14)}
.sw button.on{box-shadow:0 0 0 2px var(--elev),0 0 0 4px var(--ink)}
.sw.big button{width:34px;height:34px}
.cr2{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cr2:first-of-type{border-top:0}
.cr2 .nm2{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;min-width:0}
.cr2 .nm2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr2 .nm2 i{width:10px;height:10px;border-radius:99px;background:var(--c);flex:0 0 auto}
.cr2 .sw button{width:18px;height:18px}
.cr2 .sw{gap:4px;flex-wrap:nowrap}
.pre{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pre button{border:2px solid var(--line);background:var(--soft);border-radius:16px;padding:10px 8px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);transition:border-color .18s ease,transform .15s ease}

.strip{display:flex}
.strip i{width:13px;height:13px;border-radius:99px;margin-left:-3px;box-shadow:0 0 0 2px var(--soft)}
.strip i:first-child{margin-left:0;width:17px;height:17px;margin-top:-2px;margin-right:2px}
.pophint{margin:14px 0 0;font-size:12.5px;color:var(--mut)}
.cpbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cc{display:flex;gap:6px;align-items:center}
.cc button{width:18px;height:18px;border-radius:99px;border:0;padding:0;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(128,128,128,.3);transition:transform .15s ease}
.cc button:hover{transform:scale(1.2)}
.cc button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.popf{display:flex;justify-content:flex-end;margin-top:10px}
.popf button{background:none;border:0;color:var(--mut);font-weight:700;cursor:pointer;font-size:13px;padding:6px 4px}
.popf button:hover{color:var(--ink)}
@media (max-width:520px){.cr2{grid-template-columns:1fr}}
.tg:hover{background:var(--line)}
.tg:active{transform:scale(.92)}
.tg svg{grid-area:1/1;width:19px;height:19px;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .3s ease}
.tg .moon{opacity:0;transform:rotate(-70deg) scale(.4)}
:root[data-theme=dark] .tg .sun{opacity:0;transform:rotate(70deg) scale(.4)}
:root[data-theme=dark] .tg .moon{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){html.theming,html.theming *,html.theming *::before,html.theming *::after{transition:background-color .4s ease,color .4s ease,border-color .4s ease,fill .4s ease,stroke .4s ease,box-shadow .4s ease!important}}
.tabs{display:flex;gap:4px;overflow-x:auto}

main{padding:34px 0 110px}
.page-h{font-family:var(--disp);font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-0.05em;line-height:1}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;width:100%;min-height:290px;cursor:pointer;border:0;border-radius:32px;padding:24px 24px 22px;background:var(--c);color:var(--fg);box-shadow:var(--shadow)}

.tbar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--fg) 20%,transparent);overflow:hidden;margin-top:16px}
.tbar i{display:block;height:100%;background:var(--fg);border-radius:99px}
.tile small{display:block;margin-top:8px;font-size:12.5px;opacity:.85}
.tile .late{display:inline-block;margin-top:9px;padding:3px 11px;border-radius:99px;background:var(--fg);color:var(--c);font-size:12px;font-weight:700}

.panel{padding:6px 26px}
.up{display:grid;grid-template-columns:116px minmax(0,1fr);gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.up:last-child{border-bottom:0}

.dot{width:12px;height:12px;border-radius:99px;background:var(--c);flex:0 0 auto}
.up .c .dot{width:9px;height:9px}
.empty{padding:18px 0;color:var(--mut)}
.banner{margin-top:22px;padding:15px 20px;border-radius:20px;background:var(--gold);color:#2B1D00}
.banner b{font-weight:800}

.gpagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.gp{padding:20px 24px}
.gp .t{color:var(--mut);font-size:13.5px;font-weight:600}
.gp .v{font-family:var(--disp);font-size:clamp(32px,4.4vw,42px);font-weight:800;letter-spacing:-0.05em;line-height:1.1;margin-top:8px;color:var(--blue)}
.gp .s{color:var(--mut);font-size:13.5px;margin-top:6px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:12.5px}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
td .dot{display:inline-block;margin-right:12px;width:11px;height:11px;vertical-align:-1px}
.scroll{overflow-x:auto}

input[type=number],input[type=text],select{background:var(--soft);border:2px solid transparent;border-radius:12px;padding:8px 11px;width:100%;min-width:0}
input[type=number]:hover,input[type=text]:hover,select:hover{border-color:var(--line)}

input[type=number]{-moz-appearance:textfield;appearance:textfield}
td input[type=number]{width:78px}
td select{width:116px}

.semgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
.sem{padding:0;overflow:hidden}
.semtop{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;background:var(--hd);color:var(--hf)}
.semtop h3{font-size:17px;font-weight:800;letter-spacing:-0.02em}
.semtop .g{font-family:var(--disp);font-size:28px;font-weight:800;letter-spacing:-0.05em;line-height:1;text-align:right}
.semtop .g small{display:block;font:600 12px "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:0;margin-top:6px;opacity:.85}
input[type=time],input[type=date]{background:var(--soft);border:2px solid transparent;border-radius:12px;padding:7px 10px;color:var(--ink);font:inherit;min-width:0;transition:border-color .18s ease,background-color .18s ease}
input[type=time]:hover,input[type=date]:hover{border-color:var(--line)}
input[type=time]:focus,input[type=date]:focus{border-color:var(--blue);background:var(--elev);outline:0}
.meets{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:18px;background:var(--soft);width:100%}
.mrow input{background:var(--card)}
.mrow .mloc{flex:1 1 130px;width:auto}
.dchips{display:flex;gap:4px}
.dchips button{all:unset;cursor:pointer;width:32px;height:32px;border-radius:99px;display:grid;place-items:center;font:700 12px "Plus Jakarta Sans",system-ui,sans-serif;background:var(--card);color:var(--mut);transition:background-color .15s ease,color .15s ease,transform .15s ease}
.dchips button:hover{transform:scale(1.08)}
.dchips button.on{background:var(--blue);color:#fff}
.mtimes{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.mdel{all:unset;cursor:pointer;width:28px;height:28px;border-radius:99px;display:grid;place-items:center;color:var(--mut);font-size:18px}
.mdel:hover{background:var(--line);color:var(--ink)}
.cal .calhead{padding:clamp(18px,3vw,28px);margin-top:18px}
.caltop{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.calname{font-weight:700;color:var(--mut)}
.caldates{display:flex;gap:10px;flex-wrap:wrap}
.caldates label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.calsum{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.calwk{font-family:var(--disp);font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-0.05em;line-height:1}
.calwk small{font:600 15px "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:0;color:var(--mut);margin-left:10px}
.calnote{font-weight:700;color:var(--blue);background:var(--blue-soft);padding:6px 14px;border-radius:99px;font-size:13px}
.calprog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:16px}
.calprog i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.wks{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.wk{all:unset;cursor:pointer;min-width:32px;height:32px;box-sizing:border-box;padding:0 4px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--mut);font:700 12px "Plus Jakarta Sans",system-ui,sans-serif;transition:background-color .15s ease,color .15s ease,transform .15s ease}
.wk:hover{transform:translateY(-1px);color:var(--ink)}
.wk.now{box-shadow:inset 0 0 0 2px var(--blue)}
.wk.on{background:var(--blue);color:#fff}
.calhint{color:var(--mut);font-size:14px}
.calhint.pad{padding:4px 22px 0}
.calcard{margin-top:22px;background:var(--elev);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.caltb{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;flex-wrap:wrap}
.calnav{display:flex;gap:6px}
.calnav .tg{width:36px;height:36px}
.calnav .tg:disabled{opacity:.35;cursor:default;transform:none}
.caltitle{flex:1;font-family:var(--disp);font-weight:800;letter-spacing:-0.04em;font-size:clamp(18px,3vw,24px);min-width:140px}
.caltitle small{font:600 13px "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:0;color:var(--mut);margin-left:8px}
.calscroll{overflow-x:auto;padding:0 12px 16px}
.calgrid{display:grid;grid-template-columns:44px repeat(var(--n),minmax(0,1fr));min-width:calc(44px + var(--n)*92px)}
.dh{text-align:center;padding:6px 0 10px}
.dh b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.dh span{display:inline-grid;place-items:center;min-width:36px;height:36px;border-radius:99px;font:800 18px var(--disp);letter-spacing:-0.04em}

.dh.outsem{opacity:.4}
.dlab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:6px 6px 0 0;text-align:right}
.dues{display:flex;flex-direction:column;gap:4px;padding:2px 3px 10px;min-width:0}
.cdue{all:unset;cursor:pointer;box-sizing:border-box;font:700 11px "Plus Jakarta Sans",system-ui,sans-serif;padding:4px 8px;border-radius:8px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cdue.ev2{background:var(--c);color:#111;border-left-color:transparent}

/* ---------- tour + setup ---------- */
html.tour-lock,html.tour-lock body{overflow:hidden}
.tour{position:fixed;inset:0;z-index:250;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);opacity:0;transition:opacity .45s cubic-bezier(.2,.7,.2,1)}
.tour.open{opacity:1}
.tour.closing{opacity:0;transition-duration:.35s}
.tbg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tbg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:tdrift 18s ease-in-out infinite alternate}
.tbg i:nth-child(1){background:#7B5CFF;left:-12vmax;top:-14vmax}
.tbg i:nth-child(2){background:#19C3A5;right:-14vmax;top:18vh;animation-delay:-6s;animation-duration:22s}
.tbg i:nth-child(3){background:#FF7A59;left:22vw;bottom:-22vmax;animation-delay:-11s;animation-duration:26s;opacity:.26}
@keyframes tdrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-4vmax,7vmax) scale(.94)}}
.tframe{position:relative;width:min(1060px,100%);height:min(660px,calc(100vh - 40px));display:flex;flex-direction:column;border-radius:36px;background:var(--card);border:1px solid var(--line);box-shadow:0 50px 120px -30px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.12);overflow:hidden;transform:translateY(26px) scale(.965);transition:transform .7s cubic-bezier(.16,1,.3,1)}
.tour.open .tframe{transform:none}
.tour.closing .tframe{transform:translateY(14px) scale(.98)}
.tbars{display:flex;gap:6px;padding:22px 92px 0 30px}
.tbars i{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden;cursor:pointer}
.tbars b{display:block;height:100%;width:0;border-radius:9px;background:var(--ink);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.tbars i.done b,.tbars i.cur b{width:100%}
.tskip{all:unset;cursor:pointer;position:absolute;top:13px;right:20px;z-index:3;padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px;color:var(--mut);transition:background-color .2s,color .2s}
.tskip:hover{background:var(--soft);color:var(--ink)}
.tslides{position:relative;flex:1;min-height:0;touch-action:pan-y}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);align-items:center;gap:10px;padding:10px 30px 0 56px;opacity:0;pointer-events:none;transform:translateX(34px);filter:blur(6px);transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.16,1,.3,1),filter .55s ease}
.slide.past{transform:translateX(-34px)}
.slide.on{opacity:1;pointer-events:auto;transform:none;filter:none}

.slide.play .tx>*:nth-child(2){animation-delay:.07s}
.slide.play .tx>*:nth-child(3){animation-delay:.14s}
@keyframes trise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

function gpaCalc(kind){
  let cr=0,qp=0,missing=[],all=0;
  S.courses.forEach(c=>{
    if(!(c.credits>0)){ missing.push(c.name); return; }
    all+=c.credits;
    if(c.noGpa) return;
    let g=null;
    if(kind==='cur') g=gpaOf(c,courseRes(c,'cur').pct);
    else if(kind==='proj') g=gpaOf(c,courseRes(c,'proj').pct);
    else if(kind==='whatif') g=gpaOf(c,courseRes(c,'whatif').pct);
    else { const pick=S.gpaPick[c.id]; g=(pick&&GPAOF[pick]!==undefined)?GPAOF[pick]:gpaOf(c,courseRes(c,pick==='proj'?'proj':'whatif').pct); }
    if(g==null) return;
    cr+=c.credits; qp+=c.credits*g;
  });
  return {cr:cr,all:all,qp:qp,sem:cr?qp/cr:null,cum:(PRIOR_CR+cr)?(PRIOR_QP+qp)/(PRIOR_CR+cr):null,missing:missing};
}

function chartSvg(pts){

  let g='';

  const solid=pts.filter(p=>!p.proj), last=pts.filter(p=>p.proj);
  const d=a=>a.map((p,i)=>(i?'L':'M')+X(pts.indexOf(p)).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative GPA by semester">'+g;
  if(solid.length>1){
    const base=(H-pb).toFixed(1);
    s+='<path class="ch-area" d="'+d(solid)+' L'+X(solid.length-1).toFixed(1)+' '+base+' L'+X(0).toFixed(1)+' '+base+' Z"/>';
  }
  s+='<path class="ch-line" d="'+d(solid)+'"/>';
  if(last.length&&solid.length){ const lp=solid[solid.length-1]; s+='<path class="ch-line" stroke-dasharray="2 9" d="M'+X(pts.indexOf(lp)).toFixed(1)+' '+Y(lp.v).toFixed(1)+' L'+X(pts.indexOf(last[0])).toFixed(1)+' '+Y(last[0].v).toFixed(1)+'"/>'; }
  pts.forEach(function(p,i){
    s+='<circle class="ch-dot'+(p.proj?' proj':'')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="7"/>';

  });

}

const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function setTxt(el,t){
  if(!el||el.textContent===t) return;

  if(!REDUCED){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function tweenPct(el,to){
  if(!el) return;
  const from=el._v; el._v=to;
  cancelAnimationFrame(el._raf);
  clearTimeout(el._to);
  if(REDUCED||to==null||from==null||from===to){ el.textContent=pctS(to); return; }
  const t0=performance.now(), D=420;
  clearTimeout(el._to); el._to=setTimeout(function(){ cancelAnimationFrame(el._raf); el.textContent=pctS(to); },D+80);
  (function step(now){
    const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3);
    el.textContent=k<1?f3(from+(to-from)*e)+'%':pctS(to);
    if(k<1) el._raf=requestAnimationFrame(step);
  })(t0);
}

/* ---------- sync through your own private GitHub repo ---------- */
const SYNC_KEY='gt-sync';
function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||'null'); }catch(e){ return null; } }
function setSyncCfg(c){ try{ if(c) localStorage.setItem(SYNC_KEY,JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); }catch(e){} }
const b64e=t=>btoa(unescape(encodeURIComponent(t)));
const b64d=t=>decodeURIComponent(escape(atob(String(t).replace(/\s/g,''))));
const dataCount=d=>(d&&Array.isArray(d.sems))?d.sems.reduce((a,x)=>a+(x.courses||[]).length,0):((d&&d.courses)?d.courses.length:0);
function ghFetch(cfg,method,body){
  return fetch('https://api.github.com/repos/'+cfg.repo+'/contents/'+(cfg.path||'grade-tracker-data.json'),{method:method,cache:'no-store',
    headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
}
async function pullRemote(cfg){
  const r=await ghFetch(cfg,'GET');
  if(r.status===404) return {none:true};
  if(r.status===401||r.status===403) throw new Error('GitHub refused the token. Check it has Contents read and write on that repo.');
  if(!r.ok) throw new Error('GitHub said '+r.status);
  const j=await r.json(); return {sha:j.sha,data:JSON.parse(b64d(j.content))};
}
async function pushRemote(cfg,sha){
  const r=await ghFetch(cfg,'PUT',{message:'Sync grades',content:b64e(JSON.stringify(W)),sha:sha||undefined});
  if(r.status===409||r.status===422) return {conflict:true};
  if(r.status===401||r.status===403||r.status===404) throw new Error('GitHub refused the write. Check the repo name and the token’s Contents read and write permission.');
  if(!r.ok) throw new Error('GitHub said '+r.status);
  const j=await r.json(); return {sha:j.content&&j.content.sha};
}
function adoptRemote(v){
  const keep=view; W=loadAny(v); W.ts=v.ts||0; S=W.sems.find(x=>x.id===W.active)||W.sems[0]; W.active=S.id;
  refreshPrior(); syncColors(); try{ localStorage.setItem(KEY3,JSON.stringify(W)); }catch(e){}
  if(keep!=='home'&&keep!=='cal'&&!getC(keep)) view='home'; editing=false; render(true);
}
let syncBusy=false, syncAgain=false, syncT=null;
function syncStatus(t,warn,busy){ const m=document.getElementById('syncmsg'); if(m) m.textContent=t; setStat(t,warn?'warn':(busy?'busy':'ok')); if(!warn&&!busy){ clearTimeout(statT); statT=setTimeout(function(){ setStat('',''); },1800); } }
function scheduleSync(){ if(!syncCfg()) return; clearTimeout(syncT); syncT=setTimeout(function(){ syncNow(); },2500); }
async function syncNow(){
  const cfg=syncCfg(); if(!cfg||!W) return;
  if(syncBusy){ syncAgain=true; return; } syncBusy=true;
  try{
    syncStatus('Syncing…',false,true);
    const rem=await pullRemote(cfg);
    if(rem.none){ const p=await pushRemote(cfg,null); if(p.conflict) syncAgain=true; }
    else{
      const rts=(rem.data&&rem.data.ts)||0, lts=W.ts||0;
      let useCloud=rts>lts;
      if(!cfg.synced&&hasData()&&dataCount(rem.data)>0&&rts!==lts){

const AI_PROMPT=`I'm going to give you my syllabi and/or my grades (PDFs, screenshots, spreadsheets, Canvas exports, or pasted text). Turn everything into ONE JSON file for my Tally web app, and give it back as a downloadable file named grades.json (or, if you can't make files, as a single code block I can save as grades.json).

What to do:
- For each syllabus: create the class, and read its grading policy carefully. Pull out every grade category and its weight, how scores are combined (average, total points, best N, dropped lowest scores, a final that replaces the lowest exam, optional extra work that replaces a low score, capped points), the grading scale cutoffs, the credits, any extra credit, and any rules worth remembering (late policy, attendance, no make-ups). Put those rules in the class "notes" as short plain sentences.
- Create every graded item you can find in the syllabus or schedule (each exam, quiz, homework, project, reflection) as an item with its due date, "earned": null, and its point value ("outOf"). If the syllabus doesn't give points, use 100.
- If I also give you grades, fill in "earned" for the items they match. Don't guess scores: if a score isn't graded or isn't given, use null.
- If the syllabus has other grading rules, add them: a category's "dropHighest" (number), "curvePoints" (points added to a category, like 3), a class's "curvePercent" (points added to the final percent), a class's "rounding" ("nearest" if the final percent rounds to the nearest whole number, or "up" if it always rounds up), and "requirements" such as [{ "category": "Final exam", "minPercent": 60, "otherwiseMaxGrade": "D" }] when the class caps your grade unless you hit a minimum. Leave out anything the syllabus doesn't say.
- If the syllabus or schedule gives when each class meets (days, start and end time in 24-hour format, and the room), put it in "meetings" (one entry per different meeting pattern, such as a lecture and a lab). If it gives the semester's first and last day, put them in "startDate" and "endDate" (YYYY-MM-DD). Leave these out if they aren't given.
- If something is unclear or the syllabus contradicts itself (weights that don't add to 100, a missing scale), ask me before you write the file.

Use exactly this format:

{
  "semesters": [
    {
      "name": "Fall 2026",
      "startDate": "2026-08-24",
      "endDate": "2026-12-11",
      "current": true,
      "finished": false,
      "classes": [
        {
          "name": "Intro to Biology",
          "code": "BIOSC 0150",
          "professor": "Dr. Smith",
          "credits": 3,
          "meetings": [{ "days": ["Mon", "Wed"], "start": "09:30", "end": "10:45", "location": "Room 101" }],
          "scale": "plus-minus",
          "categories": [
            {
              "name": "Homework",
              "weight": 20,
              "scoring": "average",
              "dropLowest": 1,
              "items": [
                { "name": "HW 1", "earned": 9, "outOf": 10 },
                { "name": "HW 2", "earned": null, "outOf": 10, "due": "2026-09-30" }
              ]
            },
            {
              "name": "Exams",
              "weight": 80,
              "scoring": "average",
              "replaceLowestWithFlagged": true,
              "items": [
                { "name": "Midterm", "earned": 80, "outOf": 100 },
                { "name": "Final", "earned": null, "outOf": 100, "replacesLowest": true }
              ]
            }
          ]
        }
      ]
    }
  ],
  "earlier": [
    { "name": "Spring 2026", "classes": [ { "name": "Calculus I", "credits": 4, "grade": "A-" } ] }
  ]
}

Rules:
- "weight" is the category's share of the final grade in percent (they should add up to 100).
- "scoring" is one of: "average" (each item counts equally), "total" (add up all points), "best" (also add "bestN", how many scores count), "capped" (also add "fullCreditPercent", e.g. 80 means 80% of all points is full credit), or "optionalReplaceLowest" (items marked "optional": true replace the lowest regular score if higher).
- "dropLowest" is how many of the lowest scores get dropped (average or total only).
- "scale" is "plus-minus" (A+, A, A-, B+ ...) or "plain" (A, B, C). If the syllabus lists its own cutoffs, add "cutoffs": [ {"letter":"A","min":93,"gpa":4}, ... ].
- If a class is graded by total points instead of weighted categories, set "totalPointsGrading": true and use one category.
- Semesters where I only know the final letter grades go under "earlier". Semesters where I have the full breakdown go under "semesters". Mark this semester "current": true.
- "due" is a date like "2026-09-30". "notes" is an array of short strings.
- Optional extra credit per class: "extraCredit": { "points": 2, "percent": null, "totalPoints": 400 }.`;

function nthDow(y,m,dow,n){ const d=new Date(y,m,1); const first=(dow-d.getDay()+7)%7; return isoD(new Date(y,m,1+first+7*(n-1))); }
function lastDow(y,m,dow){ const d=new Date(y,m+1,0); return isoD(new Date(y,m,d.getDate()-((d.getDay()-dow+7)%7))); }
function addUSHolidays(){
  const st=S.start, en=S.end; if(!(st&&en&&en>=st)){ alert('Set your semester’s first and last day first, then I can add the holidays that fall inside it.'); return; }
  const out=[]; const y0=pd(st).getFullYear(), y1=pd(en).getFullYear();
  for(let y=y0;y<=y1;y++){
    const th=nthDow(y,10,4,4);
    [['New Year’s Day',y+'-01-01',y+'-01-01'],['Martin Luther King Jr. Day',nthDow(y,0,1,3)],['Presidents’ Day',nthDow(y,1,1,3)],['Memorial Day',lastDow(y,4,1)],['Juneteenth',y+'-06-19'],['Independence Day',y+'-07-04'],['Labor Day',nthDow(y,8,1,1)],['Indigenous Peoples’ Day',nthDow(y,9,1,2)],['Veterans Day',y+'-11-11'],['Thanksgiving',th,addD(th,1)],['Christmas Day',y+'-12-25']].forEach(h=>out.push({t:h[0],kind:'holiday',start:h[1],end:h[2]||h[1]}));
  }
  S.off=S.off||[]; let n=0;
  out.forEach(h=>{ if(h.end<st||h.start>en) return; if(S.off.some(o=>o.t===h.t&&o.start===h.start)) return; S.off.push(normOff(h)); n++; });
  save(); calRedraw(); setStat(n?'Added '+n+' holiday'+(n===1?'':'s'):'Those holidays are already added','ok');
}

function activeRules(c){
  const L=[];
  RULES.forEach(R=>{
    if(R.scope==='cat'){ if(c.pooled) return; c.cats.forEach((k,ki)=>{ if(R.on(c,k)) L.push({R:R,k:ki,t:R.label(c,k)}); }); }
    else if(R.scope==='course'){ if(R.on(c)) L.push({R:R,t:R.label(c)}); }
  });
  if(!c.pooled) (c.reqs||[]).forEach((q,qi)=>{ const k=c.cats[q.cat]; if(k) L.push({R:RULES.find(r=>r.id==='req'),q:qi,t:k.name+' ≥ '+trim(String(q.min))+'% or grade capped at '+q.cap}); });
  return L;
}

function ruleForm(c,id,ki,qi){
  const R=RULES.find(r=>r.id===id); if(!R) return;
  const editing=(R.scope==='cat'&&ki!=null)||(R.scope==='course'&&R.on(c))||(R.scope==='req'&&qi!=null);
  const q=R.scope==='req'&&qi!=null?c.reqs[qi]:null;
  let body='<p class="hint" style="margin:-6px 0 4px;text-transform:none;letter-spacing:0;font-weight:500;font-size:13.5px">'+R.desc+'</p>';
  if(R.scope==='cat'){ const k0=ki!=null?c.cats[ki]:null; body+=catSel(c,'cat',ki!=null?ki:Math.max(0,c.cats.findIndex(k=>!R.on(c,k)))); body+=R.form(c,k0); }
  else if(R.scope==='req') body+=R.form(c,q); else body+=R.form(c);
  if(editing) body+='<div><button type="button" class="btn danger sm" data-act="ruleoff" data-c="'+c.id+'" data-r="'+id+'"'+(ki!=null?' data-k="'+ki+'"':'')+(qi!=null?' data-q="'+qi+'"':'')+'>Remove this rule</button></div>';
  openModal(R.name,body,editing?'Save':'Add rule',function(v){
    if(R.scope==='cat'){ const k=c.cats[+v.cat]; if(!k) return false; R.set(c,k,v); }
    else if(R.scope==='req') R.set(c,q,v); else R.set(c,null,v);
    save(); render(true);
  });
}

function quickRule(c,k,ki){

  let main='';
  if(r==='avg'||r==='sum') main='<label class="qsw"><input type="checkbox" class="swi" data-f="qdrop" '+base+(k.drop>0?' checked':'')+'><i></i><span>Drop lowest</span></label>'+(k.drop>0?step('qdropn',k.drop,k.drop===1?'score':'scores'):'')
    +'<label class="qsw"><input type="checkbox" class="swi" data-f="catrp" '+base+(k.rp?' checked':'')+'><i></i><span>Final replaces lowest</span></label>';
  else if(r==='best') main='<span class="qlab strong">Count the best</span>'+step('qbestn',k.n||real,'of '+real);
  else if(r==='cap') main='<span class="qlab strong">Capped at '+Math.round((k.cap||0.8)*100)+'% of points</span>';

      +'<button type="button" class="sopt" data-s="pick" data-h="manual"><span class="soi" style="--c:#19C3A5">＋</span><b>Add them myself</b><small>Type in class names and credits. Add categories and scores later.</small></button>'
      +'<button type="button" class="sopt" data-s="pick" data-h="sample"><span class="soi" style="--c:#FFC233">◎</span><b>Try a sample semester</b><small>Explore with made-up classes first. Delete it anytime.</small></button></div>'
      +'<div class="sact"><button type="button" class="btn" data-s="back" data-to="sem">Back</button><span></span></div>');
    else if(step==='ai') h=card('<span class="tk">Step 3 · AI setup</span><h2>Let AI read your syllabi.</h2><p class="slead">Takes about a minute. Works with ChatGPT, Claude, or any chat that can make files.</p><ol class="ssteps">'
      +'<li><span class="sn">1</span><div><b>Copy the Tally prompt</b><small>It tells the AI exactly what file to make.</small></div><button type="button" class="btn pri sm" data-s="copy">Copy prompt</button></li>'
      +'<li><span class="sn">2</span><div><b>Open a chat and attach your syllabi</b><small>Paste the prompt, attach syllabi and any grades (PDFs, screenshots, Canvas exports).</small></div><div class="sbtns"><a class="btn sm" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT ↗</a><a class="btn sm" href="https://claude.ai/new" target="_blank" rel="noopener">Claude ↗</a></div></li>'
      +'<li><span class="sn">3</span><div><b>Drop the file it gives you</b><small>Usually called grades.json.</small></div></li></ol>'
      +'<label class="sdrop" id="sDrop"><input type="file" id="sFile" accept=".json,application/json" hidden><span class="sdi">⤓</span><b>Drop grades.json here</b><small>or click to choose the file</small><span class="serr" id="sErr"></span></label>'
      +'<div class="sact"><button type="button" class="btn" data-s="back" data-to="how">Back</button><span></span></div>');
    else if(step==='manual') h=card('<span class="tk">Step 3 · Your classes</span><h2>Add your classes.</h2><p class="slead">Just the names for now. Each one starts with Homework, Midterm and Final, and you can change that anytime.</p>'
      +'<div class="srows">'+rows.map((r,j)=>'<div class="srow" style="--d:'+(j*60)+'ms"><input type="text" data-r="'+j+'" data-k="n" value="'+esc(r.n)+'" placeholder="'+(['Organic Chemistry','Statistics','Writing Seminar','Class name'][Math.min(j,3)])+'" aria-label="Class name"><input type="number" step="0.5" min="0" inputmode="decimal" data-r="'+j+'" data-k="c" value="'+esc(r.c)+'" placeholder="Credits" aria-label="Credits"></div>').join('')+'</div>'
      +'<button type="button" class="sadd" data-s="addrow">＋ Another class</button>'
      +'<div class="sact"><button type="button" class="btn" data-s="back" data-to="how">Back</button><button type="button" class="btn pri" data-s="savemanual">Add classes</button></div>');
    else if(step==='done') h=card('<div class="sdone"><div class="bigmark">'+ICON_CHECK+'</div><h2>You’re all set.</h2><p class="slead">'+(how==='sample'?'The sample semester is loaded. Switch back to your own semester from the name at the top.':added?(added+' class'+(added===1?'':'es')+' added. Tap any class to fill in scores and try what-ifs.'):'Your semester is ready. Add classes anytime from the home page.')+'</p>'
      +'<button type="button" class="btn pri" data-s="close">Open Tally</button><small class="sfoot">Replay this anytime from Backup and reset at the bottom of the home page.</small></div>');
    body.innerHTML=h; const st=body.querySelector('.sstep'); requestAnimationFrame(function(){ st.classList.add('in'); });
    if(step==='ai') wireDrop();
    const f=body.querySelector('input[type=text]'); if(f&&step!=='done') setTimeout(function(){ f.focus({preventScroll:true}); },300);
  }
  function go(s){ const st=body.querySelector('.sstep'); if(st){ st.classList.add('out'); setTimeout(function(){ step=s; draw(); },180); } else { step=s; draw(); } }
  function wireDrop(){
    const dz=body.querySelector('#sDrop'), fi=body.querySelector('#sFile'), er=body.querySelector('#sErr');
    const take=function(file){ if(!file) return; const r=new FileReader(); r.onload=function(){ try{ const v=JSON.parse(r.result); if(!okFile(v)) throw 0; const before=courseCount(); importFile(v); added=Math.max(0,courseCount()-before); how='ai'; go('done'); }catch(e){ er.textContent='That file isn’t a Tally grade file. Ask the AI to use the exact format from the prompt.'; dz.classList.add('bad'); setTimeout(function(){ dz.classList.remove('bad'); },600); } }; r.readAsText(file); };
    fi.addEventListener('change',function(){ take(fi.files[0]); });
    ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,function(e){ e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave','drop'].forEach(t=>dz.addEventListener(t,function(e){ e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop',function(e){ take(e.dataTransfer&&e.dataTransfer.files[0]); });
  }
  fr.addEventListener('input',function(e){ const t=e.target; if(t.dataset.r!=null) rows[+t.dataset.r][t.dataset.k]=t.value; });
  fr.addEventListener('click',function(ev){
    const b=ev.target.closest('[data-s]'); if(!b) return; const a=b.dataset.s;
    if(a==='close'){ tourClose(); view='home'; setHash(); render(); window.scrollTo(0,0); }
    else if(a==='back') go(b.dataset.to);
    else if(a==='semnext'){ const n=(body.querySelector('#sName').value||'').trim(); if(n) S.name=n; const s1=body.querySelector('input[name=sStart]').value, s2=body.querySelector('input[name=sEnd]').value; S.start=s1||''; S.end=s2||''; if(S.start&&S.end&&S.end<S.start){ const x=S.start; S.start=S.end; S.end=x; } save(); render(true); go('how'); }
    else if(a==='pick'){ const h=b.dataset.h; if(h==='sample'){ const before=courseCount(); mergeSimple(sampleSemester()); added=courseCount()-before; how='sample'; go('done'); } else go(h); }
    else if(a==='copy'){ const done=function(){ b.textContent='Copied ✓'; b.classList.add('ok'); setTimeout(function(){ b.textContent='Copy prompt'; b.classList.remove('ok'); },2000); };
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(AI_PROMPT).then(done,function(){ fallbackCopy(AI_PROMPT); done(); }); else { fallbackCopy(AI_PROMPT); done(); } }
    else if(a==='addrow'){ rows.push({n:'',c:''}); const st=body.querySelector('.srows'); const j=rows.length-1; st.insertAdjacentHTML('beforeend','<div class="srow"><input type="text" data-r="'+j+'" data-k="n" placeholder="Class name" aria-label="Class name"><input type="number" step="0.5" min="0" inputmode="decimal" data-r="'+j+'" data-k="c" placeholder="Credits" aria-label="Credits"></div>'); st.lastElementChild.querySelector('input').focus(); }
    else if(a==='savemanual'){ const list=rows.filter(r=>r.n.trim()); if(!list.length){ const f=body.querySelector('.srow input'); if(f){ f.focus(); f.classList.add('shake'); setTimeout(function(){ f.classList.remove('shake'); },500); } return; }
      list.forEach(function(r){ const mk=(n,w,items)=>({name:n,w:w,rule:'avg',items:items}); const c=normCourse({name:r.n.trim(),credits:num(r.c),scale:'std',pooled:false,cats:[mk('Homework',30,[I('Homework 1',100),I('Homework 2',100)]),mk('Midterm',30,[I('Midterm',100)]),mk('Final exam',40,[I('Final exam',100)])]}); c.color=nextColor(); S.courses.push(c); syncColors(); });
      added=list.length; how='manual'; save(); render(true); go('done'); }
  });
  tourKey=function(e){ if(e.key==='Escape'&&!document.querySelector('.dpop,.tpop')) tourClose(); };
  document.addEventListener('keydown',tourKey,true);
  draw();
}
function fallbackCopy(t){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); }

(function(){
  const SEL=['.gnum','.hero .after b','.hc svg','.semtop .g','.semnote b','.gp .v','.gp .s','.tile .L','.tile .p','.tile .pj','.tile .mr','.gletter','.gpct','.ghint','.cpct','.rpct','.grid input[data-f=e]','.grid input[data-f=w]','td.r','.projres','.cr .gg','.cr .m','.chip','.need','.fillbox b'].join(',');
  const st=document.createElement('style'); st.id='privCss';
  st.textContent=':is('+SEL+'){transition:filter .32s cubic-bezier(.2,.7,.2,1)}'
    +'html[data-priv] :is('+SEL+'){filter:blur(max(6px,.2em));user-select:none;-webkit-user-select:none}'
    +'html[data-priv] .hc svg{filter:blur(7px)}'
    +'html[data-priv] :is('+SEL+'):is(:hover,:focus,:focus-within,.rv){filter:blur(0);user-select:auto;-webkit-user-select:auto}';
  document.head.appendChild(st);
  const root=document.documentElement, btn=document.getElementById('privBtn');
  function set(on,save){
    if(on) root.setAttribute('data-priv',''); else root.removeAttribute('data-priv');
    btn.setAttribute('aria-pressed',on?'true':'false'); const l=on?'Show grades':'Hide grades'; btn.setAttribute('aria-label',l); btn.title=l;
    if(save){ try{ localStorage.setItem('gt-priv',on?'1':'0'); }catch(e){} }
  }
  let init=false; try{ init=localStorage.getItem('gt-priv')==='1'; }catch(e){}
  set(init,false);
  btn.addEventListener('click',function(){ set(!root.hasAttribute('data-priv'),true); });
  document.addEventListener('click',function(ev){
    if(!root.hasAttribute('data-priv')||!matchMedia('(hover:none)').matches) return;
    const t=ev.target.closest&&ev.target.closest(SEL); if(!t) return;
    t.classList.add('rv'); clearTimeout(t._rt); t._rt=setTimeout(function(){ t.classList.remove('rv'); },3200);
  },true);
})();
(function init(){
  let src3=readLocal(KEY3), migrated=false;
  if(src3&&Array.isArray(src3.sems)) W=loadAny(src3);
  else{
    let emb=null; try{ emb=JSON.parse(document.getElementById('saved').textContent); }catch(e){}
    const loc=readLocal(KEY), et=(emb&&emb.ts)||0, lt=(loc&&loc.ts)||0;
    let src=(lt>et)?loc:emb;
    if(!src){ const o=readLocal(KEY1); if(o&&o.courses) src=o; }
    W=loadAny(src||null); migrated=!!src;
  }
  S=W.sems.find(x=>x.id===W.active)||W.sems[0]; W.active=S.id;
  refreshPrior(); syncColors();
  if(migrated) save();
  const h=(location.hash||'').replace('#','');
  if(h&&(h==='cal'||getC(h))) view=h;
  render();
  if(syncCfg()) syncNow();
  try{ if(localStorage.getItem(TOUR_KEY)!=='1') setTimeout(function(){ if(!tourEl) tourOpen(); },600); }catch(e){}
  try{ if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js'); }catch(e){}
  try{
    const sc=JSON.parse(sessionStorage.getItem('gt-scroll')||'null');
    if(sc&&Date.now()-sc.t<20000) window.scrollTo(0,sc.y);
    sessionStorage.removeItem('gt-scroll');
  }catch(e){}
  
})();

</script></body></html>
